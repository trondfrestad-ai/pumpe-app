<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12343B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Liksompumpe</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{margin:0;background:#12343B;color:#fff;padding:16px;max-width:480px;margin-inline:auto}
  h1{font-size:18px;font-weight:600;margin:4px 0 16px;opacity:.85}
  .kort{background:#1d4a52;border-radius:16px;padding:16px;margin-bottom:14px}
  .verdi{font-size:72px;font-weight:700;text-align:center;line-height:1}
  .enhet{text-align:center;opacity:.7;margin-bottom:10px}
  .status{text-align:center;font-weight:600;padding:10px;border-radius:10px;background:#2A9D8F}
  .alarm{background:#5a1f26}
  .alarm .status{background:#E8505B;animation:blink 1s infinite}
  .venter .status{background:#F4A261;color:#12343B}
  @keyframes blink{50%{opacity:.55}}
  #kvitter{display:none;width:100%;margin-top:12px;padding:20px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:#fff;color:#E8505B}
  .alarm #kvitter{display:block}
  .hint{font-size:13px;opacity:.75;text-align:center;margin-top:8px;display:none}
  .alarm .hint{display:block}
  input[type=range]{width:100%;height:40px;accent-color:#F4A261}
  .rad{display:flex;gap:8px}
  button{cursor:pointer}
  .rad button,.knapp{flex:1;padding:14px 6px;border:0;border-radius:12px;font-size:15px;font-weight:600;background:#fff;color:#12343B}
  .rad button.valgt{background:#F4A261}
  .knapp{width:100%;margin-top:10px;background:#2A9D8F;color:#fff}
  .armband{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2c5d66;gap:8px}
  .armband:last-of-type{border:0}
  .ok{color:#7ee0c8}.borte{color:#ff9aa1}.vib{color:#ffd0a0;font-weight:700}
  .liten{padding:6px 10px;border:0;border-radius:8px;font-size:13px;background:#2c5d66;color:#fff}
  label{font-size:14px;opacity:.8}
  #feil{display:none;background:#E8505B;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<h1>Liksompumpe · demo</h1>
<div id="feil"></div>

<div id="hoved" class="kort">
  <div class="verdi" id="verdi">6.0</div>
  <div class="enhet">mmol/L</div>
  <div class="status" id="status">Normalt blodsukker</div>
  <button id="kvitter" onclick="kvitter()">KVITTER – jeg er hos barnet</button>
  <div class="hint">Alarmen kan bare stoppes her på pumpa.</div>
</div>

<div class="kort">
  <label>Blodsukker</label>
  <input type="range" id="glider" min="2" max="15" step="0.1" value="6">
  <div class="rad">
    <button id="fall" onclick="settModus('fall')">Fall sakte</button>
    <button id="stopp" onclick="settModus('stopp')" class="valgt">Stopp</button>
    <button id="stig" onclick="settModus('stig')">Gi druesukker</button>
  </div>
</div>

<div class="kort">
  <label>Alarmgrense: <b id="gtekst">4.0</b> mmol/L</label>
  <input type="range" id="grense" min="3" max="6" step="0.1" value="4">
</div>

<div class="kort">
  <label>Armbånd (Bluetooth)</label>
  <div id="liste"></div>
  <button class="knapp" onclick="kobleTil()">+ Koble til armbånd</button>
</div>

<script>
// ---------- Innstillinger ----------
const SERVICE_UUID  = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const KOMMANDO_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const PAMINNELSE_MIN = 10;   // ny alarm hvis blodsukkeret fortsatt er lavt etter kvittering
// -----------------------------------

const $ = id => document.getElementById(id);
let blodsukker = 6.0, grense = 4.0, modus = 'stopp';
let alarmAktiv = false, alarmStart = 0, kvittertTid = 0, ventPaNormalt = false;
const armband = [];   // {navn, enhet, kar, tilkoblet, tilstand}

if (!navigator.bluetooth) {
  $('feil').style.display = 'block';
  $('feil').innerHTML = 'Denne nettleseren støtter ikke Bluetooth. Bruk <b>Chrome på Android</b> eller på PC/Mac. ' +
    'På iPhone: bruk appen <b>Bluefy</b>. Simuleringen virker likevel, men uten armbånd.';
}

// ---------- Bluetooth ----------
async function kobleTil() {
  try {
    const enhet = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Armband' }],
      optionalServices: [SERVICE_UUID]
    });
    let a = armband.find(x => x.enhet.id === enhet.id);
    if (!a) {
      a = { navn: enhet.name || 'Armbånd', enhet, kar: null, tilkoblet: false, tilstand: '' };
      armband.push(a);
      enhet.addEventListener('gattserverdisconnected', () => frakoblet(a));
    }
    await koble(a);
  } catch (e) {
    if (e.name !== 'NotFoundError') visFeil('Kunne ikke koble til: ' + e.message);
  }
  tegn();
}

async function koble(a) {
  const server = await a.enhet.gatt.connect();
  const tjeneste = await server.getPrimaryService(SERVICE_UUID);
  a.kar = await tjeneste.getCharacteristic(KOMMANDO_UUID);
  await a.kar.startNotifications();
  a.kar.addEventListener('characteristicvaluechanged', ev => {
    a.tilstand = new TextDecoder().decode(ev.target.value);
    tegn();
  });
  a.tilkoblet = true;
  await send(a, alarmAktiv ? 'ON' : 'OFF');   // gi armbåndet riktig tilstand med en gang
}

function frakoblet(a) {
  if (a.fjernet) return;
  a.tilkoblet = false;
  a.kar = null;
  tegn();
  // prøv å koble til igjen automatisk
  setTimeout(async () => { if (!a.tilkoblet) { try { await koble(a); tegn(); } catch (e) { frakoblet(a); } } }, 3000);
}

// Bluetooth tåler bare én skriving om gangen per armbånd – derfor en kø
async function send(a, tekst) {
  if (!a.kar) return;
  a.ko = (a.ko || Promise.resolve()).then(() =>
    a.kar ? a.kar.writeValueWithResponse(new TextEncoder().encode(tekst)) : null
  ).catch(e => console.warn(a.navn, e));
  return a.ko;
}
function sendAlle(tekst) { armband.forEach(a => a.tilkoblet && send(a, tekst)); }

function testArmband(i) { send(armband[i], 'TEST'); }
function fjernArmband(i) {
  const a = armband[i];
  a.fjernet = true;
  try { a.enhet.gatt.disconnect(); } catch (e) {}
  armband.splice(i, 1); tegn();
}

// ---------- Alarmlogikk (samme regler som en ekte pumpe ville hatt) ----------
function startAlarm() {
  alarmAktiv = true; alarmStart = Date.now(); ventPaNormalt = false;
  sendAlle('ON');
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
}
function oppdaterAlarm() {
  const lavt = blodsukker < grense;
  if (alarmAktiv) return;                       // står til noen kvitterer
  if (ventPaNormalt) {
    if (blodsukker >= grense + 0.3) ventPaNormalt = false;
    else if (lavt && Date.now() - kvittertTid >= PAMINNELSE_MIN * 60000) startAlarm();
  } else if (lavt) startAlarm();
}
function kvitter() {
  if (!alarmAktiv) return;
  alarmAktiv = false; kvittertTid = Date.now();
  ventPaNormalt = blodsukker < grense + 0.3;
  sendAlle('OFF');
  tegn();
}

// ---------- Kontroller ----------
let drar = false;
$('glider').addEventListener('input', e => { drar = true; blodsukker = +e.target.value; modus = 'stopp'; tegn(); });
$('glider').addEventListener('change', () => { drar = false; oppdaterAlarm(); tegn(); });
$('grense').addEventListener('input', e => { grense = +e.target.value; oppdaterAlarm(); tegn(); });
function settModus(m) { modus = m; tegn(); }

setInterval(() => {
  if (modus === 'fall') blodsukker = Math.max(2, blodsukker - 0.2);
  if (modus === 'stig') { blodsukker = Math.min(15, blodsukker + 0.4); if (blodsukker >= 6) modus = 'stopp'; }
  blodsukker = Math.round(blodsukker * 10) / 10;
  oppdaterAlarm();
  tegn();
}, 1000);

// Send alarmen på nytt hvert 5. sekund, i tilfelle et armbånd har koblet seg til igjen
setInterval(() => { if (alarmAktiv) sendAlle('ON'); }, 5000);

// ---------- Visning ----------
const tid = s => s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
function tegn() {
  if (!drar) $('glider').value = blodsukker;
  $('verdi').textContent = blodsukker.toFixed(1);
  $('gtekst').textContent = grense.toFixed(1);
  $('hoved').className = 'kort' + (alarmAktiv ? ' alarm' : (ventPaNormalt ? ' venter' : ''));
  $('status').textContent = alarmAktiv
    ? ((Date.now() - alarmStart) < 15000 ? 'ALARM – korte vibrasjoner (' : 'IKKE KVITTERT – konstant vibrasjon (')
      + tid(Math.floor((Date.now() - alarmStart) / 1000)) + ')'
    : ventPaNormalt
      ? 'Kvittert for ' + tid(Math.floor((Date.now() - kvittertTid) / 1000)) + ' siden – fortsatt lavt'
      : 'Normalt blodsukker';
  ['fall', 'stopp', 'stig'].forEach(m => $(m).className = modus === m ? 'valgt' : '');
  $('liste').innerHTML = armband.length === 0
    ? '<div class="armband"><span style="opacity:.7">Ingen armbånd koblet til ennå</span></div>'
    : armband.map((a, i) => {
        const t = !a.tilkoblet ? ['borte', 'frakoblet – prøver igjen']
                : a.tilstand === 'ALARM' ? ['vib', 'vibrerer'] : ['ok', 'tilkoblet'];
        return `<div class="armband"><span>${a.navn}<br><small class="${t[0]}">${t[1]}</small></span>
          <span><button class="liten" onclick="testArmband(${i})">Test</button>
          <button class="liten" onclick="fjernArmband(${i})">Fjern</button></span></div>`;
      }).join('');
}
function visFeil(t) { $('feil').style.display = 'block'; $('feil').textContent = t; }
tegn();

// Gjør appen installerbar og brukbar uten nett (krever https eller localhost)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
